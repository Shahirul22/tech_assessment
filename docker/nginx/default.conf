server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Docker's DNS, with the upstream in a variable: nginx then re-resolves `app` instead of caching the
    # address it saw at startup, so recreating the app container does not leave nginx pointing at a dead IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
