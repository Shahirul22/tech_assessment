[www]
user = www-data
group = www-data
listen = 9000

; Static pool: 50 requests in parallel must each get a worker (NFR1 / plan §11 risk 1).
pm = static
pm.max_children = 60

; Let Compose's env_file values reach PHP (Laravel reads them with getenv()).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
